{% extends "base.html" %}

{% block title %}Logged Out - POS System{% endblock %}

{% block login_content %}
<div class="logout-container">
    <div class="logout-card">
        <div class="logout-icon">
            <span class="material-icons">logout</span>
        </div>
        <h1>You've been logged out</h1>
        <p class="logout-message">Thank you for using POS System. You have been securely logged out.</p>

        <div class="logout-actions">
            <a href="{{ url_for('login') }}" class="btn-login">
                <span class="material-icons">login</span>
                Sign In Again
            </a>
        </div>

        <div class="auto-redirect">
            <p>Redirecting to login page in <span id="countdown" class="countdown">3</span> seconds...</p>
            <button class="btn-secondary" onclick="stopRedirect()" id="stopBtn">Stay Here</button>
        </div>
    </div>
</div>

<style>
.logout-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1rem;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.logout-card {
    background: white;
    border-radius: 20px;
    padding: 3rem 2rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 400px;
    width: 100%;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logout-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
}

.logout-icon .material-icons {
    font-size: 36px;
    color: white;
}

.logout-card h1 {
    margin: 0 0 1rem 0;
    font-size: 1.75rem;
    font-weight: 700;
    color: #1f2937;
    line-height: 1.2;
}

.logout-message {
    margin: 0 0 2rem 0;
    font-size: 1rem;
    color: #6b7280;
    line-height: 1.5;
}

.logout-actions {
    margin-bottom: 2rem;
}

.btn-login {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.875rem 2rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    border: none;
    cursor: pointer;
}

.btn-login:hover {
    background: linear-gradient(135deg, #5a67d8, #6b46c1);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

.btn-login:active {
    transform: translateY(0);
}

.auto-redirect {
    border-top: 1px solid #e5e7eb;
    padding-top: 1.5rem;
}

.auto-redirect p {
    margin: 0 0 1rem 0;
    font-size: 0.875rem;
    color: #6b7280;
}

.countdown {
    font-weight: 700;
    color: #4CAF50;
}

.btn-secondary {
    padding: 0.5rem 1rem;
    background: transparent;
    color: #6b7280;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-secondary:hover {
    background: #f9fafb;
    color: #374151;
    border-color: #9ca3af;
}

/* Focus states for accessibility */
.btn-login:focus,
.btn-secondary:focus {
    outline: 2px solid #667eea;
    outline-offset: 2px;
}

/* Responsive design */
@media (max-width: 480px) {
    .logout-container {
        padding: 1rem;
    }

    .logout-card {
        padding: 2rem 1.5rem;
    }

    .logout-card h1 {
        font-size: 1.5rem;
    }

    .logout-message {
        font-size: 0.9rem;
    }

    .btn-login {
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
    }
}
</style>

<script>
let countdown = 3;
let redirectInterval;
const countdownElement = document.getElementById('countdown');
const stopBtn = document.getElementById('stopBtn');

function startCountdown() {
    redirectInterval = setInterval(() => {
        countdown--;
        if (countdownElement) {
            countdownElement.textContent = countdown;
        }

        if (countdown <= 0) {
            clearInterval(redirectInterval);
            window.location.href = '{{ url_for("login") }}';
        }
    }, 1000);
}

function stopRedirect() {
    clearInterval(redirectInterval);
    if (countdownElement) {
        countdownElement.textContent = 'stopped';
    }
    if (stopBtn) {
        stopBtn.disabled = true;
        stopBtn.textContent = 'Redirect Stopped';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    startCountdown();

    // Focus management for accessibility
    const loginBtn = document.querySelector('.btn-login');
    if (loginBtn) {
        loginBtn.focus();
    }
});

// Handle keyboard navigation
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && redirectInterval) {
        stopRedirect();
    }
});
</script>
{% endblock %}
