{% extends "base.html" %}

{% block title %}Forgot Password - POS System{% endblock %}

{% block login_content %}
<div class="login-section">
    <div class="login-container">
        <h2>🔑 Forgot Password</h2>
        <p class="help-text">Enter your username and answer your secret question to reset your password.</p>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>

            <div id="secretQuestionSection" style="display: none;">
                <div class="form-group">
                    <label id="secretQuestionLabel">Secret Question</label>
                    <p id="secretQuestionText" class="secret-question-display"></p>
                </div>

                <div class="form-group">
                    <label for="secret_answer">Your Answer</label>
                    <input type="text" id="secret_answer" name="secret_answer" placeholder="Enter your answer">
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" minlength="6" placeholder="Enter new password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password">
                </div>
            </div>

            <button type="button" id="checkUserBtn" class="btn btn-primary" style="width: 100%;">Next</button>
            <button type="submit" id="resetBtn" class="btn btn-success" style="width: 100%; display: none;">Reset Password</button>

            <div class="form-footer">
                <a href="{{ url_for('login') }}" class="link">← Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const checkUserBtn = document.getElementById('checkUserBtn');
    const resetBtn = document.getElementById('resetBtn');
    const secretQuestionSection = document.getElementById('secretQuestionSection');
    const usernameInput = document.getElementById('username');
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');

    let userSecretQuestion = '';

    // Check if user exists and has secret question
    checkUserBtn.addEventListener('click', function() {
        const username = usernameInput.value.trim();

        if (!username) {
            alert('Please enter your username');
            return;
        }

        // Check user via API
        fetch('/api/check_user', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username: username })
        })
        .then(response => response.json())
        .then(data => {
            if (data.found) {
                if (data.has_secret_question) {
                    userSecretQuestion = data.secret_question;
                    document.getElementById('secretQuestionText').textContent = userSecretQuestion;
                    secretQuestionSection.style.display = 'block';
                    checkUserBtn.style.display = 'none';
                    resetBtn.style.display = 'block';
                    usernameInput.readOnly = true;
                } else {
                    alert('No secret question set for this user. Please contact your administrator.');
                }
            } else {
                alert('User not found. Please check your username.');
            }
        })
        .catch(error => {
            console.error('Error checking user:', error);
            alert('Error checking user. Please try again.');
        });
    });

    // Password confirmation validation
    function validatePasswords() {
        if (newPassword.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('Passwords do not match');
        } else {
            confirmPassword.setCustomValidity('');
        }
    }

    newPassword.addEventListener('input', validatePasswords);
    confirmPassword.addEventListener('input', validatePasswords);

    // Handle form submission
    document.querySelector('form').addEventListener('submit', function(e) {
        const username = usernameInput.value.trim();
        const secretAnswer = document.getElementById('secret_answer').value.trim();
        const newPass = newPassword.value;
        const confirmPass = confirmPassword.value;

        if (!username || !secretAnswer || !newPass || !confirmPass) {
            e.preventDefault();
            alert('Please fill in all fields');
            return;
        }

        if (newPass !== confirmPass) {
            e.preventDefault();
            alert('Passwords do not match');
            return;
        }

        if (newPass.length < 6) {
            e.preventDefault();
            alert('Password must be at least 6 characters long');
            return;
        }
    });
});
</script>
{% endblock %}
